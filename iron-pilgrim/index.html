<title>Iron Pilgrim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Big+Shoulders+Text:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<div class="app">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 2V22M14.5 2V22"/><circle cx="12" cy="12" r="6.5"/></svg><span>IRON PILGRIM</span></div>
    <button class="btn ghost small" id="snd" aria-pressed="false">Sound on</button>
  </header>
  <div id="hud" class="hud" hidden></div>
  <main id="stage" class="stage" aria-live="polite"></main>
  <div id="sheet" class="sheet" hidden></div>
  <nav id="dock" class="dock" hidden aria-label="Train">
    <button data-sheet="train"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/><path d="M3 12H21"/></svg>Train</button>
    <button data-sheet="crew"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/></svg>Crew</button>
    <button data-sheet="radio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="15.5" cy="14" r="3"/><path d="M6 12h4M6 15h4M8 8L17 3"/></svg>Wireless</button>
    <button data-sheet="archive"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"/><path d="M8 11h8M8 14h8M8 17h5"/></svg>Archive</button>
  </nav>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/map.js"></script>
<script src="js/events.js"></script>
<script src="js/combat.js"></script>
<script src="js/game.js"></script>
